<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1123"/>
      <stop offset="100%" stop-color="#05060D"/>
    </linearGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
    <linearGradient id="ionGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ionGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#00E5FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Background Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tileBg)" stroke="url(#tileBorder)" stroke-width="3"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="rgba(0, 229, 255, 0.02)"/>

  <!-- Ion+ Brand Mark -->
  <g filter="url(#tileGlow)" transform="translate(0, 0)">
    <!-- Back Orbit (angled -32 deg) -->
    <ellipse cx="256" cy="256" rx="160" ry="60" transform="rotate(-32 256 256)" stroke="url(#ionGrad1)" stroke-width="22" stroke-linecap="round" fill="none"/>
    
    <!-- Forward Orbit (angled +32 deg) -->
    <ellipse cx="256" cy="256" rx="160" ry="60" transform="rotate(32 256 256)" stroke="url(#ionGrad2)" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Central Vertical Stem (I) -->
    <rect x="238" y="96" width="36" height="320" rx="18" fill="url(#stemGrad)"/>

    <!-- Cross Horizontal Bar (+) -->
    <rect x="190" y="130" width="132" height="36" rx="18" fill="url(#stemGrad)"/>

    <!-- Inner dynamic chevron accents -->
    <path d="M202 226 L238 198" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M310 226 L274 198" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
