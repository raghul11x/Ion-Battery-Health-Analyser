<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ionGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ionGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="ionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ionGlow)">
    <!-- Back Orbit (angled -32 deg) -->
    <ellipse cx="256" cy="256" rx="195" ry="74" transform="rotate(-32 256 256)" stroke="url(#ionGrad1)" stroke-width="26" stroke-linecap="round" fill="none"/>
    
    <!-- Forward Orbit (angled +32 deg) -->
    <ellipse cx="256" cy="256" rx="195" ry="74" transform="rotate(32 256 256)" stroke="url(#ionGrad2)" stroke-width="26" stroke-linecap="round" fill="none"/>

    <!-- Central Vertical Stem (I) -->
    <rect x="234" y="64" width="44" height="384" rx="22" fill="url(#stemGrad)"/>

    <!-- Cross Horizontal Bar (+) -->
    <rect x="176" y="104" width="160" height="44" rx="22" fill="url(#stemGrad)"/>

    <!-- Inner dynamic chevron accents -->
    <path d="M190 220 L234 185" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M322 220 L278 185" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
