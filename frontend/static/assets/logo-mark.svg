<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2DD4BF" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Battery Outer Shell -->
  <rect x="6" y="10" width="32" height="28" rx="8" stroke="url(#tealGrad)" stroke-width="2.8" fill="rgba(15, 23, 42, 0.6)" filter="url(#tealGlow)" />
